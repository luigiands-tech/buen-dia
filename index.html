<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigue brillando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --profundo: #021627;
    --medio: #06395a;
    --aqua: #7fe3f0;
    --espuma: #e8fbff;
    --tenue: #9cc4d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(127, 227, 240, .35), transparent 60%),
      linear-gradient(180deg, #0b5d80 0%, var(--medio) 28%, var(--profundo) 78%, #010b14 100%);
    background-color: var(--profundo);
    color: var(--espuma);
    overflow: hidden;
    font-family: "Jost", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Rayos de luz que entran desde la superficie */
  .rayos { position: fixed; inset: -20% -10% 0; pointer-events: none; z-index: 0; mix-blend-mode: screen; }
  .rayos span {
    position: absolute; top: -10%; width: 9vw; min-width: 50px; height: 120%;
    background: linear-gradient(180deg, rgba(190, 245, 255, .22), rgba(190, 245, 255, 0) 75%);
    filter: blur(14px); transform-origin: top center;
    animation: vaiven 9s ease-in-out infinite alternate;
  }
  .rayos span:nth-child(1) { left: 12%; transform: rotate(14deg); animation-duration: 11s; }
  .rayos span:nth-child(2) { left: 30%; width: 5vw; transform: rotate(8deg); animation-delay: -3s; opacity: .7; }
  .rayos span:nth-child(3) { left: 48%; width: 12vw; transform: rotate(2deg); animation-duration: 13s; }
  .rayos span:nth-child(4) { left: 66%; width: 6vw; transform: rotate(-6deg); animation-delay: -6s; opacity: .8; }
  .rayos span:nth-child(5) { left: 82%; transform: rotate(-12deg); animation-duration: 10s; opacity: .6; }
  @keyframes vaiven {
    from { translate: -2vw 0; opacity: .35; }
    to   { translate: 2vw 0;  opacity: 1; }
  }

  #burbujas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  .escena {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(20px, 4vh, 38px); padding: 16px;
  }

  /* La foto bajo el agua */
  .ventana {
    position: relative; border-radius: 26px; overflow: hidden;
    opacity: 0; transform: translateY(40px) scale(.94);
    transition: opacity 2.4s ease, transform 3.6s cubic-bezier(.16,.8,.2,1);
    box-shadow:
      0 0 0 1px rgba(200, 245, 255, .18),
      0 40px 90px -30px rgba(0, 0, 0, .8),
      0 0 70px -10px rgba(127, 227, 240, .35);
    cursor: pointer;
    touch-action: manipulation;
  }
  .ventana.visible { opacity: 1; transform: none; }
  .ventana::after {               /* reflejo de vidrio */
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(155deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 32%);
  }
  #agua, #respaldo { display: block; }
  #respaldo { display: none; object-fit: cover; filter: saturate(.9) hue-rotate(-8deg); }

  .pista {
    position: absolute; left: 50%; bottom: 14px; translate: -50% 0;
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: rgba(232, 251, 255, .85);
    background: rgba(2, 22, 39, .35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 6px 12px; border-radius: 99px; white-space: nowrap;
    opacity: 0; transition: opacity 1.2s; pointer-events: none;
  }
  .pista.on { opacity: 1; }

  /* Mensaje */
  .mensaje { max-width: min(620px, 92vw); text-align: center; min-height: 8.5em; }
  .frase {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: clamp(21px, 3.2vw, 32px); line-height: 1.35;
    text-wrap: balance;
    text-shadow: 0 2px 24px rgba(2, 22, 39, .9);
  }
  .frase .p {
    display: inline-block;
    opacity: 0; filter: blur(8px); transform: translateY(18px);
    transition: opacity 1.4s ease, filter 1.4s ease, transform 1.8s cubic-bezier(.16,.8,.2,1);
  }
  .frase .p.on { opacity: 1; filter: blur(0); transform: none; }
  .frase .clave { color: #fff; text-shadow: 0 0 22px rgba(127, 227, 240, .8), 0 2px 24px rgba(2,22,39,.9); }
  .frase .salto { display: block; height: .25em; }

  .firma {
    margin-top: 1.3em;
    font-size: 13px; font-weight: 300; letter-spacing: .45em; text-transform: uppercase;
    opacity: 0; transform: translateY(8px);
    transition: opacity 2.2s ease, transform 2.2s ease;
  }
  .firma.on { opacity: 1; transform: none; }
  .firma .brillo {
    background: linear-gradient(100deg, var(--tenue) 20%, #fff 45%, var(--aqua) 55%, var(--tenue) 80%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: destello 4.5s ease-in-out infinite;
  }
  .firma .estrella { display: inline-block; letter-spacing: 0; margin-left: .2em; animation: titilar 2.4s ease-in-out infinite; }
  @keyframes destello { 0% { background-position: 100% 0; } 60%, 100% { background-position: -50% 0; } }
  @keyframes titilar { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(1.25) rotate(12deg); opacity: .7; } }

  #repetir {
    position: fixed; right: 18px; bottom: 18px; z-index: 4;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(200, 245, 255, .22);
    background: rgba(255, 255, 255, .06);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--espuma); font-size: 18px; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 1s, transform .5s, border-color .3s;
  }
  #repetir.on { opacity: 1; pointer-events: auto; }
  #repetir:hover { transform: rotate(-90deg); border-color: var(--aqua); }

  @media (prefers-reduced-motion: reduce) {
    .rayos span, .firma .brillo, .firma .estrella { animation: none; }
  }
</style>
</head>
<body>

<div class="rayos" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<canvas id="burbujas" aria-hidden="true"></canvas>

<main class="escena">
  <div class="ventana" id="ventana">
    <canvas id="agua"></canvas>
    <img id="respaldo" alt="">
    <span class="pista" id="pista">Toca el agua</span>
  </div>

  <section class="mensaje" aria-live="polite">
    <p class="frase" id="frase"></p>
    <p class="firma" id="firma"><span class="brillo" id="firmaTexto"></span><span class="estrella" id="firmaEmoji"></span></p>
  </section>
</main>

<button id="repetir" title="Ver de nuevo" aria-label="Ver de nuevo">↻</button>

function medir() {
  const maxAlto = innerHeight * 0.56;
  const maxAncho = Math.min(innerWidth - 32, 440);
  const k = Math.min(maxAlto / img.height, maxAncho / img.width);
  W = Math.round(img.width * k); H = Math.round(img.height * k);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  lienzo.width = W * dpr; lienzo.height = H * dpr;
  lienzo.style.width = W + "px"; lienzo.style.height = H + "px";
  respaldo.style.width = W + "px"; respaldo.style.height = H + "px";
  if (gl) gl.viewport(0, 0, lienzo.width, lienzo.height);
}

// ---------------------- Shader del agua ----------------------
const VERT = `
attribute vec2 a; varying vec2 vUv;
void main(){ vUv = a * .5 + .5; gl_Position = vec4(a, 0., 1.); }`;

const FRAG = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uFocus;
uniform vec3 uRip[8];
varying vec2 vUv;

vec2 hash2(vec2 p){
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}
// Distancia entre las dos celdas más cercanas: líneas finas como la luz en el fondo de una piscina
float celdas(vec2 p, float t){
  vec2 i = floor(p), f = fract(p);
  float f1 = 8., f2 = 8.;
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++){
    vec2 g = vec2(float(x), float(y));
    vec2 o = hash2(i + g);
    o = .5 + .5 * sin(t + 6.2831 * o);
    float d = length(g + o - f);
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) { f2 = d; }
  }
  return f2 - f1;
}
float luzAgua(vec2 uv, float t){
  float a = celdas(uv * 4.5 + vec2(t * .04, t * .03), t * .55);
  float b = celdas(uv * 6.5 - vec2(t * .03, -t * .02) + 3.1, t * .45 + 1.);
  return pow(1. - smoothstep(0., .24, a), 2.6) * .55 + pow(1. - smoothstep(0., .2, b), 2.6) * .4;
}

void main(){
  vec2 uv = vUv;
  float asp = uRes.x / uRes.y;
  float t = uTime;

  // Ondulación suave de la superficie (más fuerte mientras está "en el fondo")
  float amp = mix(.016, .0035, uFocus);
  vec2 off = vec2(
    sin(uv.y * 17. + t * 1.3) + .6 * sin(uv.y * 6.5 - t * .9 + uv.x * 3.),
    cos(uv.x * 15. + t * 1.1) + .6 * cos(uv.x * 8.5 + t * .7 - uv.y * 2.)
  ) * amp * .5;

  // Ondas al tocar
  for (int i = 0; i < 8; i++){
    vec3 r = uRip[i];
    float edad = t - r.z;
    if (r.z > 0. && edad > 0. && edad < 5.){
      vec2 dv = (uv - r.xy) * vec2(asp, 1.);
      float d = length(dv);
      float frente = edad * .32;
      float w = sin((d - frente) * 75.) * exp(-abs(d - frente) * 13.) * exp(-edad * 1.05);
      if (d > .0005) off += (dv / d) * w * .014 * vec2(1. / asp, 1.);
    }
  }

  vec2 suv = clamp(uv + off, 0., 1.);

  // Desenfoque mientras está sumergida
  float br = (1. - uFocus) * .016;
  vec3 col = texture2D(uTex, suv).rgb;
  for (int k = 0; k < 8; k++){
    float an = float(k) * .7854;
    col += texture2D(uTex, clamp(suv + vec2(cos(an) / asp, sin(an)) * br, 0., 1.)).rgb;
  }
  col /= 9.;

  // Color del agua: muy azul al principio, un toque aguamarina al final
  vec3 profundo = vec3(.02, .17, .30);
  col = mix(col, profundo + col * vec3(.15, .45, .6), .72 * (1. - uFocus));
  col *= mix(vec3(1.), vec3(.93, 1.02, 1.06), .9);

  // Luz del agua bailando sobre la foto
  float c = luzAgua(vec2(uv.x * asp, uv.y) + off * 3., t);
  col += c * vec3(.72, .95, 1.) * (.08 + .08 * uFocus);

  // Luz que entra desde arriba y viñeta
  col += vec3(.12, .3, .36) * pow(uv.y, 4.) * .35;
  float v = length((uv - .5) * vec2(1., 1.15));
  col *= mix(1., .62, smoothstep(.35, .85, v));

  gl_FragColor = vec4(col, 1.);
}`;

function iniciarGL() {
  gl = lienzo.getContext("webgl", { premultipliedAlpha: false, antialias: false });
  if (!gl) return usarRespaldo();
  const sh = (tipo, src) => {
    const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
    return s;
  };
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    gl.useProgram(prog);
  } catch (e) { console.warn(e); return usarRespaldo(); }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  for (const n of ["uTex", "uRes", "uTime", "uFocus", "uRip"]) loc[n] = gl.getUniformLocation(prog, n);
  gl.uniform1i(loc.uTex, 0);
  gl.viewport(0, 0, lienzo.width, lienzo.height);
}

// Sin WebGL: la foto con un filtro azul sencillo
function usarRespaldo() {
  gl = null;
  lienzo.style.display = "none";
  respaldo.src = CONFIG.foto;
  respaldo.style.display = "block";
}

function cuadro() {
  const t = ahora();
  const p = Math.min(1, Math.max(0, (performance.now() - inicioEmerger) / CONFIG.emergerMs));
  enfoque = suave(p);
  if (gl) {
    gl.uniform2f(loc.uRes, lienzo.width, lienzo.height);
    gl.uniform1f(loc.uTime, t);
    gl.uniform1f(loc.uFocus, enfoque);
    gl.uniform3fv(loc.uRip, ondas);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(cuadro);
}

function onda(x, y) {
  ondas.set([x, y, ahora()], ondaIdx * 3);
  ondaIdx = (ondaIdx + 1) % 8;
}

// ---------------------- Secuencia ----------------------
function iniciar() {
  timeouts.forEach(clearTimeout); timeouts = [];
  ventana.classList.remove("visible");
  elFrase.innerHTML = ""; elFirma.classList.remove("on");
  btnRepetir.classList.remove("on"); pista.classList.remove("on");
  inicioEmerger = Infinity;
  ondas.fill(0);

  requestAnimationFrame(() => ventana.classList.add("visible"));
  espera(() => { inicioEmerger = performance.now(); burbujas.rafaga(40); }, CONFIG.esperaMs);
  espera(() => onda(.5, .62), CONFIG.esperaMs + CONFIG.emergerMs * .78);   // una gota cae al final
  espera(mostrarMensaje, CONFIG.esperaMs + CONFIG.emergerMs * .85);
}

function mostrarMensaje() {
  const partes = CONFIG.frase.split("|").map(s => s.trim());
  let n = 0;
  partes.forEach((parte, idx) => {
    if (idx > 0) { const br = document.createElement("span"); br.className = "salto"; elFrase.append(br); }
    parte.split(" ").forEach((palabra, i, arr) => {
      const s = document.createElement("span");
      s.className = "p" + (CONFIG.palabrasClave.includes(palabra) ? " clave" : "");
      s.textContent = palabra;
      elFrase.append(s);
      if (i < arr.length - 1) elFrase.append(" ");
      espera(() => s.classList.add("on"), 300 + n++ * 220 + idx * 700);
    });
  });
  const fin = 300 + n * 220 + (partes.length - 1) * 700;
  espera(() => elFirma.classList.add("on"), fin + 1100);
  espera(() => {
    btnRepetir.classList.add("on");
    if (!tocado && gl) pista.classList.add("on");
  }, fin + 2600);
}

// ---------------------- Interacción ----------------------
let ultimaOnda = 0;
function posicion(e) {
  const r = lienzo.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
}
ventana.addEventListener("pointerdown", e => {
  const [x, y] = posicion(e); onda(x, y);
  burbujas.rafaga(8, e.clientX, e.clientY);
  if (!tocado) { tocado = true; pista.classList.remove("on"); }
});
ventana.addEventListener("pointermove", e => {
  if (e.pointerType === "touch" && e.buttons === 0) return;
  const t = performance.now();
  if (t - ultimaOnda < 140) return;
  ultimaOnda = t;
  const [x, y] = posicion(e); onda(x, y);
});

btnRepetir.onclick = () => { tocado = false; iniciar(); };

let reajuste;
addEventListener("resize", () => {
  clearTimeout(reajuste);
  reajuste = setTimeout(() => { if (img.complete) medir(); }, 200);
});

// ---------------------- Burbujas ----------------------
const burbujas = (() => {
  const c = document.getElementById("burbujas");
  const g = c.getContext("2d");
  let lista = [], dpr = 1;
  const ajustar = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  ajustar(); addEventListener("resize", ajustar);

  const nueva = (x, y, r) => ({
    x: x ?? Math.random() * innerWidth,
    y: y ?? innerHeight + 20,
    r: r ?? 1 + Math.random() * Math.random() * 7,
    v: .3 + Math.random() * .9,
    fase: Math.random() * 6.28,
    amp: .3 + Math.random() * 1.2,
  });

  function rafaga(n, x, y) {
    for (let i = 0; i < n; i++) {
      const b = nueva(
        x !== undefined ? x + (Math.random() - .5) * 40 : undefined,
        x !== undefined ? y + Math.random() * 20 : innerHeight + Math.random() * 200
      );
      b.v *= 1.6;
      lista.push(b);
    }
  }

  function dibujar() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    if (Math.random() < .22 && lista.length < 90) lista.push(nueva());
    for (const b of lista) {
      b.y -= b.v * (1 + b.r * .08);
      b.fase += .03;
      const x = b.x + Math.sin(b.fase) * b.amp * 3;
      const grad = g.createRadialGradient(x - b.r * .35, b.y - b.r * .35, b.r * .1, x, b.y, b.r);
      grad.addColorStop(0, "rgba(255,255,255,.55)");
      grad.addColorStop(.6, "rgba(190,245,255,.06)");
      grad.addColorStop(1, "rgba(190,245,255,.35)");
      g.fillStyle = grad;
      g.beginPath(); g.arc(x, b.y, b.r, 0, 6.2832); g.fill();
    }
    lista = lista.filter(b => b.y > -20);
    requestAnimationFrame(dibujar);
  }
  dibujar();
  return { rafaga };
})();
</script>
