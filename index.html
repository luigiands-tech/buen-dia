<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #0b0a08;
    --carbon: #15130f;
    --oro: #d4af37;
    --oro-claro: #f6e3a1;
    --oro-oscuro: #8a6a2a;
    --texto: #ece6da;
    --tenue: #9b917f;
    --dorado: linear-gradient(110deg, #8a6a2a 0%, #c9a24a 22%, #f6e3a1 42%, #d4af37 58%, #9c7a32 78%, #e9cf85 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse 60% 70% at 30% 50%, rgba(212, 175, 55, .09), transparent 70%),
      radial-gradient(ellipse at center, var(--carbon) 0%, var(--negro) 75%);
    background-color: var(--negro);
    color: var(--texto);
    font-family: "Jost", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Cinematic Reveal: franjas de cine ---------- */
  .cine { position: fixed; left: 0; right: 0; height: 50vh; background: #000; z-index: 20; transition: transform 2.2s cubic-bezier(.7,0,.2,1); }
  .cine.arriba { top: 0; }
  .cine.abajo { bottom: 0; }
  body.abierto .cine.arriba { transform: translateY(-100%); }
  body.abierto .cine.abajo  { transform: translateY(100%); }

  #particulas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  .escena {
    position: relative; z-index: 2;
    min-height: 100vh; min-height: 100svh;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    align-items: center; gap: clamp(32px, 6vw, 90px);
    max-width: 1120px; margin: 0 auto;
    padding: clamp(28px, 6vh, 64px) clamp(16px, 5vw, 56px);
    perspective: 1200px;
  }

  /* ---------- Foto ---------- */
  .marco-wrap { justify-self: end; position: relative; width: min(100%, 400px); transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  .marco-wrap::before {           /* Elegant Glow detrás */
    content: ""; position: absolute; inset: -12%;
    background: radial-gradient(closest-side, rgba(212, 175, 55, .28), transparent);
    filter: blur(40px); z-index: -1; opacity: 0; transition: opacity 3s ease 1.6s;
  }
  body.abierto .marco-wrap::before { opacity: 1; animation: respirar 6s ease-in-out infinite 4s; }
  @keyframes respirar { 50% { opacity: .55; transform: scale(1.06); } }

  .marco {
    position: relative; aspect-ratio: 4 / 5; overflow: hidden;
    border-radius: var(--r, 200px) var(--r, 200px) 14px 14px;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(212,175,55,.25);
    transition: box-shadow 2s ease;
  }
  body.listo .marco { box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(212,175,55,.45), 0 0 50px -8px rgba(212,175,55,.45); }
  .marco img {
    position: absolute; inset: -4%; width: 108%; height: 108%;
    object-fit: cover; object-position: 50% 30%;
    transform: scale(1.22); filter: blur(16px) brightness(.25) saturate(.6);
    transition: transform 3.6s cubic-bezier(.16,.8,.2,1), filter 2.8s ease;
    will-change: transform;
  }
  body.abierto .marco img { transform: scale(1) translate(var(--px, 0), var(--py, 0)); filter: blur(0) brightness(1) saturate(1); }
  body.listo .marco img { transition: transform .9s cubic-bezier(.2,.7,.2,1), filter 2.8s ease; }

  /* Golden Light Sweep sobre la foto */
  .marco::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255, 236, 170, .0) 40%, rgba(255, 236, 170, .35) 50%, rgba(255, 236, 170, 0) 60%, transparent 65%);
    background-size: 300% 100%; background-position: 150% 0;
    mix-blend-mode: soft-light;
  }
  body.listo .marco::after { animation: barrido 7s ease-in-out infinite; }
  @keyframes barrido { 0% { background-position: 150% 0; } 35%, 100% { background-position: -60% 0; } }

  /* Filo dorado que se dibuja */
  .filo { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); pointer-events: none; overflow: visible; }
  .filo path { fill: none; stroke: url(#oro); stroke-width: 1.2; stroke-dasharray: var(--largo); stroke-dashoffset: var(--largo); transition: stroke-dashoffset 3.2s cubic-bezier(.6,0,.2,1) 1.4s; }
  body.abierto .filo path { stroke-dashoffset: 0; }

  /* ---------- Texto ---------- */
  .texto { position: relative; transition: transform .9s cubic-bezier(.2,.7,.2,1); }

  .nombre {
    font-family: "Cinzel", Georgia, serif; font-weight: 600;
    font-size: clamp(46px, 8.4vw, 104px); line-height: 1; letter-spacing: .08em;
    display: flex; flex-wrap: nowrap; white-space: nowrap;
  }
  .nombre .caja { display: inline-block; overflow: hidden; padding-bottom: .06em; }
  .nombre .letra {
    display: inline-block;
    background: var(--dorado); background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transform: translateY(110%) rotate(6deg); opacity: 0;
    transition: transform 1.2s cubic-bezier(.16,.8,.2,1), opacity 1s ease;
    filter: drop-shadow(0 0 18px rgba(212,175,55,.25));
  }
  .nombre .letra.on { transform: none; opacity: 1; }
  body.listo .nombre .letra { animation: brillo-oro 5.5s ease-in-out infinite; }
  @keyframes brillo-oro { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }

  .cargo { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
  .cargo .linea { height: 1px; width: 0; transition: width 1.4s cubic-bezier(.6,0,.2,1); }
  .cargo .izq { background: linear-gradient(90deg, transparent, var(--oro)); }
  .cargo .der { background: linear-gradient(90deg, var(--oro), transparent); }
  .cargo.on .linea { width: clamp(40px, 6vw, 72px); }
  .cargo #cargoTxt {
    font-size: clamp(12px, 1.3vw, 14px); font-weight: 400; text-transform: uppercase;
    color: var(--oro-claro); letter-spacing: .9em; opacity: 0;
    transition: letter-spacing 2s cubic-bezier(.16,.8,.2,1), opacity 1.6s ease;
  }
  .cargo.on #cargoTxt { letter-spacing: .42em; opacity: .9; }

  .frase {
    margin-top: clamp(26px, 4.5vh, 44px);
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: clamp(21px, 2.3vw, 30px); line-height: 1.42; color: var(--texto);
    max-width: 30ch; text-wrap: pretty;
    padding-left: clamp(16px, 2vw, 24px);
    border-left: 1px solid rgba(212,175,55,.0);
    transition: border-color 2s ease;
  }
  .frase.on { border-left-color: rgba(212,175,55,.35); }
  .frase .p {
    display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(12px);
    transition: opacity 1.2s ease, filter 1.2s ease, transform 1.4s cubic-bezier(.16,.8,.2,1);
  }
  .frase .p.on { opacity: 1; filter: none; transform: none; }
  .frase .clave {
    background: var(--dorado); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 400;
  }

  .firma-marca {
    margin-top: clamp(26px, 4vh, 40px); padding-left: clamp(16px, 2vw, 24px);
    font-size: 11px; letter-spacing: .5em; text-transform: uppercase; color: var(--tenue);
    opacity: 0; transition: opacity 2s ease;
  }
  .firma-marca.on { opacity: 1; }

  #repetir {
    position: fixed; right: 18px; bottom: 18px; z-index: 10;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(212,175,55,.35); background: rgba(20,18,14,.5);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--oro-claro); font-size: 18px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 1s, transform .5s, box-shadow .4s;
  }
  #repetir.on { opacity: 1; pointer-events: auto; }
  #repetir:hover { transform: rotate(-90deg); box-shadow: 0 0 20px rgba(212,175,55,.45); }

  /* ---------- Celular ---------- */
  @media (max-width: 760px) {
    .escena { grid-template-columns: 1fr; gap: 30px; text-align: center; padding-top: 36px; padding-bottom: 70px; }
    .marco-wrap { justify-self: center; width: min(78vw, 330px); }
    .nombre { justify-content: center; }
    .cargo { justify-content: center; }
    .frase { margin-left: auto; margin-right: auto; padding-left: 0; border-left: none; }
    .firma-marca { padding-left: 0; }
  }
  @media (min-width: 761px) { .cargo .der { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<div class="cine arriba"></div>
<div class="cine abajo"></div>
<canvas id="particulas" aria-hidden="true"></canvas>

<main class="escena">
  <div class="marco-wrap" id="marcoWrap">
    <div class="marco" id="marco"><img id="foto" alt=""></div>
    <svg class="filo" id="filo" aria-hidden="true">
      <defs>
        <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6e3a1"/><stop offset=".45" stop-color="#d4af37"/>
          <stop offset=".75" stop-color="#8a6a2a"/><stop offset="1" stop-color="#e9cf85"/>
        </linearGradient>
      </defs>
      <path id="filoPath"/>
    </svg>
  </div>

  <div class="texto" id="texto">
    <h1 class="nombre" id="nombre"></h1>
    <p class="cargo" id="cargo"><span class="linea izq"></span><span id="cargoTxt"></span><span class="linea der"></span></p>
    <p class="frase" id="frase"></p>
    <p class="firma-marca" id="marca"></p>
  </div>
</main>

<button id="repetir" title="Ver de nuevo" aria-label="Ver de nuevo">↻</button>

$("cargoTxt").textContent = CONFIG.cargo;
document.title = `${CONFIG.nombre} · ${CONFIG.cargo}`;

// Arco superior y filo dorado según el tamaño real
function ajustarMarco() {
  const w = marco.offsetWidth, h = marco.offsetHeight;
  const r = w / 2;
  marco.style.setProperty("--r", r + "px");
  const o = 12, W = w + o * 2, H = h + o * 2, R = r + o, rb = 14 + o;
  const svg = $("filo"), path = $("filoPath");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  path.setAttribute("d",
    `M ${W/2} ${H} L ${rb} ${H} Q 0 ${H} 0 ${H-rb} L 0 ${R} A ${R} ${R} 0 0 1 ${W} ${R} L ${W} ${H-rb} Q ${W} ${H} ${W-rb} ${H} Z`);
  path.style.setProperty("--largo", path.getTotalLength());
}

function armarTexto() {
  const nombre = $("nombre"); nombre.innerHTML = "";
  nombre.setAttribute("aria-label", CONFIG.nombre);
  [...CONFIG.nombre.toUpperCase()].forEach(ch => {
    const caja = document.createElement("span"); caja.className = "caja";
    const l = document.createElement("span"); l.className = "letra"; l.textContent = ch === " " ? " " : ch;
    caja.append(l); nombre.append(caja);
  });
  const frase = $("frase"); frase.innerHTML = "";
  CONFIG.frase.split(" ").forEach((p, i, arr) => {
    const s = document.createElement("span");
    s.className = "p" + (CONFIG.palabrasClave.includes(p) ? " clave" : "");
    s.textContent = p; frase.append(s);
    if (i < arr.length - 1) frase.append(" ");
  });
  $("marca").textContent = CONFIG.marca;
  ajustarNombre();
}

// El nombre siempre en una sola línea: si no cabe, se reduce la letra
function ajustarNombre() {
  const nombre = $("nombre");
  nombre.style.fontSize = "";
  const disponible = texto.clientWidth;
  const ocupado = nombre.scrollWidth;
  if (ocupado > disponible) {
    const actual = parseFloat(getComputedStyle(nombre).fontSize);
    nombre.style.fontSize = (actual * disponible / ocupado * .97) + "px";
  }
}

function iniciar() {
  timeouts.forEach(clearTimeout); timeouts = [];
  document.body.classList.remove("abierto", "listo");
  ["cargo", "frase", "marca"].forEach(id => $(id).classList.remove("on"));
  $("repetir").classList.remove("on");
  armarTexto();
  ajustarMarco();

  espera(() => document.body.classList.add("abierto"), 500);            // se abren las franjas de cine

  const letras = [...document.querySelectorAll(".nombre .letra")];
  letras.forEach((l, i) => espera(() => l.classList.add("on"), 2300 + i * 110));
  const tNombre = 2300 + letras.length * 110;
  espera(() => particulas.rafaga(), tNombre - 200);

  espera(() => $("cargo").classList.add("on"), tNombre + 500);
  espera(() => $("frase").classList.add("on"), tNombre + 1400);
  const palabras = [...document.querySelectorAll(".frase .p")];
  palabras.forEach((p, i) => espera(() => p.classList.add("on"), tNombre + 1500 + i * 150));
  const tFrase = tNombre + 1500 + palabras.length * 150;
  espera(() => { document.body.classList.add("listo"); $("marca").classList.add("on"); }, tFrase + 800);
  espera(() => $("repetir").classList.add("on"), tFrase + 2200);
}

foto.onload = () => iniciar();
foto.src = CONFIG.foto;
$("repetir").onclick = iniciar;
addEventListener("resize", () => { ajustarMarco(); ajustarNombre(); });

// ---------- Parallax ----------
let objetivo = { x: 0, y: 0 }, actual = { x: 0, y: 0 };
const esTactil = matchMedia("(hover: none)").matches;
addEventListener("pointermove", e => {
  if (esTactil) return;
  objetivo.x = (e.clientX / innerWidth - .5) * 2;
  objetivo.y = (e.clientY / innerHeight - .5) * 2;
});
function moverParallax(t) {
  if (esTactil) { objetivo.x = Math.sin(t / 3200) * .5; objetivo.y = Math.cos(t / 4100) * .4; }
  actual.x += (objetivo.x - actual.x) * .06;
  actual.y += (objetivo.y - actual.y) * .06;
  if (document.body.classList.contains("abierto")) {
    marcoWrap.style.transform = `rotateY(${actual.x * 5}deg) rotateX(${-actual.y * 4}deg)`;
    foto.style.setProperty("--px", `${-actual.x * 10}px`);
    foto.style.setProperty("--py", `${-actual.y * 8}px`);
    texto.style.transform = `translate(${actual.x * 8}px, ${actual.y * 6}px)`;
  }
  particulas.parallax(actual.x, actual.y);
  requestAnimationFrame(moverParallax);
}
requestAnimationFrame(moverParallax);   // arranca cuando todo el script ya cargó

// ---------- Gold Particles ----------
const particulas = (() => {
  const c = $("particulas"), g = c.getContext("2d");
  let lista = [], dpr = 1, px = 0, py = 0;
  const ajustar = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  ajustar(); addEventListener("resize", ajustar);

  const nueva = (x, y, rapida) => {
    const z = Math.random();                    // profundidad: lejos (0) a cerca (1)
    return {
      x: x ?? Math.random() * innerWidth,
      y: y ?? Math.random() * innerHeight,
      z,
      r: .6 + z * z * 3.2,
      vx: rapida ? (Math.random() - .5) * 3 : (Math.random() - .5) * .15,
      vy: rapida ? -Math.random() * 2.5 - .5 : -(.08 + Math.random() * .25),
      fase: Math.random() * 6.28,
      vida: rapida ? 1 : Infinity,
    };
  };
  for (let i = 0; i < 70; i++) lista.push(nueva());

  function rafaga() {
    const n = $("nombre").getBoundingClientRect();
    for (let i = 0; i < 60; i++) lista.push(nueva(n.left + Math.random() * n.width, n.top + Math.random() * n.height, true));
  }

  function dibujar() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    g.globalCompositeOperation = "lighter";
    for (const p of lista) {
      p.x += p.vx; p.y += p.vy; p.fase += .02;
      if (p.vida !== Infinity) { p.vida -= .008; p.vx *= .985; p.vy *= .985; }
      if (p.y < -10) { p.y = innerHeight + 10; p.x = Math.random() * innerWidth; }
      const brillo = (.35 + .65 * (.5 + .5 * Math.sin(p.fase))) * (p.vida === Infinity ? 1 : Math.max(0, p.vida));
      const x = p.x + px * (4 + p.z * 26), y = p.y + py * (3 + p.z * 20);
      const rad = p.r * (p.z > .8 ? 3 : 2.2);
      const grad = g.createRadialGradient(x, y, 0, x, y, rad);
      grad.addColorStop(0, `rgba(255, 236, 170, ${.85 * brillo})`);
      grad.addColorStop(.35, `rgba(212, 175, 55, ${.4 * brillo})`);
      grad.addColorStop(1, "rgba(212, 175, 55, 0)");
      g.fillStyle = grad;
      g.beginPath(); g.arc(x, y, rad, 0, 6.2832); g.fill();
    }
    g.globalCompositeOperation = "source-over";
    lista = lista.filter(p => p.vida > 0);
    requestAnimationFrame(dibujar);
  }
  dibujar();
  return { rafaga, parallax: (x, y) => { px = x; py = y; } };
})();
</script>
</body>
</html>
